<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040916"/>
      <stop offset="50%" stop-color="#091b42"/>
      <stop offset="100%" stop-color="#003566"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with smooth rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Glow Border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#cyanGrad)" stroke-width="6" stroke-opacity="0.6"/>

  <!-- Center Shield / Emblem -->
  <path d="M 256 90 L 390 145 C 390 280 256 370 256 405 C 256 370 122 280 122 145 Z" fill="rgba(0, 240, 255, 0.08)" stroke="url(#cyanGrad)" stroke-width="8" filter="url(#glow)"/>

  <!-- Bell Symbol inside shield -->
  <g transform="translate(256, 210) scale(1.4)">
    <!-- Bell body -->
    <path d="M -30 20 C -30 -20 30 -20 30 20 L 38 40 L -38 40 Z" fill="url(#goldGrad)" filter="url(#glow)"/>
    <!-- Bell top handle -->
    <path d="M -8 -20 C -8 -30 8 -30 8 -20" fill="none" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
    <!-- Bell clapper -->
    <circle cx="0" cy="46" r="10" fill="#f59e0b"/>
  </g>

  <!-- Text "АСОШ №2" -->
  <text x="256" y="345" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">
    АСОШ №2
  </text>
  
  <!-- Subtitle -->
  <text x="256" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#00f0ff" text-anchor="middle" letter-spacing="4">
    УМНЫЙ ДНЕВНИК
  </text>
</svg>
